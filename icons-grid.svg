  <!-- Lightning -->
  <g transform="translate(26, 26)">
    <circle class="f i" cx="12" cy="12" r="10"/>
    <polygon class="c" points="12,3 5,13 11,13 10,21 19,11 11,11"/>
  </g>
</svg>
